<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그들은 왜 이런 소비를 할까?</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="section" aria-labelledby="scene-title">
      <h1 id="scene-title" class="visually-hidden">그들은 왜 이런 소비를 할까?</h1>
      <div class="scene">
      <span class="step" id="basket-1" aria-hidden="true"></span>
      <span class="step" id="basket-2" aria-hidden="true"></span>
      <span class="step" id="basket-3" aria-hidden="true"></span>
      <span class="step" id="basket-4" aria-hidden="true"></span>
        <img class="art art--intro" src="upload/intro-art.svg" alt="좋아하는 캐릭터를 모으는 순간, 쌓였던 스트레스가 풀리고 마음이 채워진다.">
        <img class="art art--active" src="upload/basket-scene.svg" alt="">
        <img class="basket basket--base" src="upload/empty-basket.png" alt="장바구니">
        <img class="basket addition addition--1" src="upload/megumi-basket.png" alt="메구미">
        <img class="basket addition addition--2" src="upload/strawberry-basket.png" alt="딸기 인형">
        <img class="basket addition addition--3" src="upload/바구니 속 세 봉제인형(2).png" alt="갈색 머리 인형">
        <img class="basket addition addition--4" src="upload/바구니 틈새의 카츠라 인형(1).png" alt="카츠라">
      <svg class="art gauge-fill" viewBox="0 0 5442.52 3061.42" aria-hidden="true">
        <defs>
          <clipPath id="stress-shape"><polygon points="1111.95 2662.47 1166.44 2601.39 4748.67 2601.39 4802.24 2654.97 4749.21 2715.11 1168.82 2715.11 1111.95 2662.47"/></clipPath>
          <clipPath id="satisfaction-shape"><polygon points="1111.95 2874.35 1166.44 2813.27 4748.67 2813.27 4802.24 2866.84 4749.21 2926.98 1168.82 2926.98 1111.95 2874.35"/></clipPath>
        </defs>
        <g clip-path="url(#stress-shape)">
          <rect class="fill-stress" x="1111.95" y="2601.39" height="113.72" fill="#fb2384"/>
        </g>
        <g clip-path="url(#satisfaction-shape)">
          <rect class="fill-satisfaction" x="1111.95" y="2813.27" height="113.71" fill="#1f2a88"/>
        </g>
      </svg>
      <img class="art" src="upload/gauge-art.svg" alt="">
      <div class="levels levels--0">
        <div class="meter meter--stress" role="meter" aria-label="스트레스" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span>100%</span></div>
        <div class="meter meter--satisfaction" role="meter" aria-label="만족감" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span>0%</span></div>
      </div>
      <div class="levels levels--1">
        <div class="meter meter--stress" role="meter" aria-label="스트레스" aria-valuemin="0" aria-valuemax="100" aria-valuenow="90"><span>90%</span></div>
        <div class="meter meter--satisfaction" role="meter" aria-label="만족감" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10"><span>10%</span></div>
      </div>
      <div class="levels levels--2">
        <div class="meter meter--stress" role="meter" aria-label="스트레스" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80"><span>80%</span></div>
        <div class="meter meter--satisfaction" role="meter" aria-label="만족감" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"><span>20%</span></div>
      </div>
      <div class="levels levels--3">
        <div class="meter meter--stress" role="meter" aria-label="스트레스" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><span>70%</span></div>
        <div class="meter meter--satisfaction" role="meter" aria-label="만족감" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30"><span>30%</span></div>
      </div>
      <div class="levels levels--4">
        <div class="meter meter--stress" role="meter" aria-label="스트레스" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><span>60%</span></div>
        <div class="meter meter--satisfaction" role="meter" aria-label="만족감" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40"><span>40%</span></div>
      </div>
      <a class="next next--0" href="#basket-1" aria-label="메구미 담기"></a>
      <a class="next next--1" href="#basket-2" aria-label="딸기 인형 담기"></a>
      <a class="next next--2" href="#basket-3" aria-label="갈색 머리 인형 담기"></a>
      <a class="next next--3" href="#basket-4" aria-label="카츠라 담기"></a>
      </div>
    </section>
  </main>
</body>
</html>
